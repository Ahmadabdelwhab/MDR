name: Lint and test

description: Install development dependencies, lint the code, and run unit tests.

runs:
  using: composite
  steps:
    - name: Install development dependencies
      run: python -m pip install -r requirements-dev.txt
      shell: bash
    - name: Run Ruff
      run: ruff check app tests
      shell: bash
    - name: Run unit tests
      run: python -m unittest discover -s tests -v
      shell: bash
