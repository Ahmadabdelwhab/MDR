name: CI/CD pipeline

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  workflow_dispatch:

concurrency:
  group: pipeline-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

env:
  IMAGE_NAME: ahmadabdelwhab/sodiummdr

jobs:
  checks:
    name: Lint and test
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"
      - name: Install development dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check app tests
      - name: Test
        run: python -m unittest discover -s tests -v

  build-image:
    name: Build Docker image
    needs: checks
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build image for validation
        uses: docker/build-push-action@v6
        with:
          context: .
          tags: mdr:ci
          outputs: type=docker,dest=/tmp/mdr-image.tar
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        with:
          name: mdr-docker-image
          path: /tmp/mdr-image.tar

  build-binaries:
    name: Build ${{ matrix.name }} binary
    needs: checks
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            name: linux
          - os: macos-latest
            name: macos
          - os: windows-latest
            name: windows
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"
      - name: Build binary
        run: python scripts/build.py
      - name: Rename binary for release
        shell: bash
        run: |
          if [ "${{ matrix.name }}" = "windows" ]; then
            cp dist/mdr.exe dist/mdr-windows.exe
          else
            cp dist/mdr "dist/mdr-${{ matrix.name }}"
          fi
      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: mdr-${{ matrix.name }}
          path: dist/mdr-*

  publish-image:
    name: Publish Docker image
    needs: build-image
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download image artifact
        uses: actions/download-artifact@v4
        with:
          name: mdr-docker-image
          path: /tmp
      - name: Load image
        run: docker load --input /tmp/mdr-image.tar
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Tag and push release image
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          VERSION_NUMBER="${VERSION#v}"
          docker tag mdr:ci "${IMAGE_NAME}:${VERSION}"
          docker tag mdr:ci "${IMAGE_NAME}:${VERSION_NUMBER}"
          docker tag mdr:ci "${IMAGE_NAME}:sha-${GITHUB_SHA}"
          docker push "${IMAGE_NAME}:${VERSION}"
          docker push "${IMAGE_NAME}:${VERSION_NUMBER}"
          docker push "${IMAGE_NAME}:sha-${GITHUB_SHA}"

  prepare-binaries:
    name: Prepare binaries for release
    needs: build-binaries
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download binary artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: mdr-linux
          path: release-assets
          merge-multiple: true
      - name: Download macOS and Windows artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: mdr-macos
          path: release-assets
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          pattern: mdr-windows
          path: release-assets
          merge-multiple: true
      - name: Store release binaries
        uses: actions/upload-artifact@v4
        with:
          name: mdr-release-assets
          path: release-assets/*

  create-release-tag:
    name: Create release tag
    needs: [checks, build-image, build-binaries]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Check out full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Create next patch tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          latest=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-version:refname | head -n 1)
          if [ -z "$latest" ]; then
            next="v0.1.0"
          else
            version="${latest#v}"
            IFS='.' read -r major minor patch <<< "$version"
            next="v${major}.${minor}.$((patch + 1))"
          fi
          echo "Creating release tag ${next}"
          git tag "${next}" "${GITHUB_SHA}"
          git push origin "${next}"

  release:
    name: Create GitHub release
    needs: [publish-image, prepare-binaries]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download release binaries
        uses: actions/download-artifact@v4
        with:
          name: mdr-release-assets
          path: release-assets
      - name: Create release and upload binaries
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" release-assets/* --clobber
          else
            gh release create "${GITHUB_REF_NAME}" release-assets/* --generate-notes
          fi
