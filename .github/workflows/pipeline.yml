name: CI/CD pipeline

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  workflow_dispatch:

concurrency:
  group: pipeline-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

env:
  IMAGE_NAME: ahmadabdelwhab/sodiummdr

jobs:
  checks:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"
      - name: Install development dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Lint
        run: |
          set -o pipefail
          ruff check app tests 2>&1 | tee lint.log
      - name: Upload lint log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-log
          path: lint.log

  release-version:
    name: Calculate release version
    needs: checks
    if: always() && needs.checks.result == 'success'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Check out tags
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Calculate version
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$EVENT_NAME" = "push" ] && [[ "$REF_NAME" == v* ]]; then
            version="$REF_NAME"
          elif [ "$EVENT_NAME" = "push" ] && [ "$REF_NAME" = "main" ]; then
            latest=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-version:refname | head -n 1)
            if [ -z "$latest" ]; then
              version="v0.1.0"
            else
              base="${latest#v}"
              IFS='.' read -r major minor patch <<< "$base"
              version="v${major}.${minor}.$((patch + 1))"
            fi
          else
            version="ci"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Using version: $version"

  build-image:
    name: Build Docker image
    needs: [checks, release-version]
    if: always() && needs.checks.result == 'success' && needs.release-version.result == 'success' && (github.event_name == 'pull_request' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Build image for validation
        run: |
          set -o pipefail
          docker build --progress=plain --tag mdr:ci . 2>&1 | tee docker-build.log
          docker save mdr:ci --output /tmp/mdr-image.tar
      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        with:
          name: mdr-docker-image
          path: /tmp/mdr-image.tar
      - name: Upload Docker build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docker-build-log
          path: docker-build.log

  container-tests:
    name: Test inside Docker
    needs: build-image
    if: always() && needs.build-image.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Download Docker image
        uses: actions/download-artifact@v4
        with:
          name: mdr-docker-image
          path: /tmp
      - name: Load image and run tests in container
        run: |
          set -o pipefail
          {
            docker load --input /tmp/mdr-image.tar
            docker run --rm mdr:ci python3 -m unittest discover -s tests -v
          } 2>&1 | tee container-test.log
      - name: Upload container test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: container-test-log
          path: container-test.log

  build-binaries:
    name: Build ${{ matrix.name }} binary
    needs: [checks, release-version, create-release-tag, container-tests]
    if: always() && needs.checks.result == 'success' && needs.release-version.result == 'success' && needs.container-tests.result == 'success' && (github.event_name == 'pull_request' || needs.create-release-tag.result == 'success')
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            name: linux
          - os: macos-latest
            name: macos
          - os: windows-latest
            name: windows
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"
      - name: Build binary
        run: python scripts/build.py
      - name: Rename binary for release
        env:
          VERSION: ${{ needs.release-version.outputs.version }}
        shell: bash
        run: |
          if [ "${{ matrix.name }}" = "windows" ]; then
            cp dist/mdr.exe "dist/mdr-${VERSION}-windows.exe"
          else
            cp dist/mdr "dist/mdr-${VERSION}-${{ matrix.name }}"
          fi
      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.name }}
          path: dist/mdr-${{ needs.release-version.outputs.version }}-*

  publish-image:
    name: Publish Docker image
    needs: [build-image, container-tests, release-version]
    if: always() && needs.build-image.result == 'success' && needs.container-tests.result == 'success' && needs.release-version.result == 'success' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    steps:
      - name: Download image artifact
        uses: actions/download-artifact@v4
        with:
          name: mdr-docker-image
          path: /tmp
      - name: Load image
        run: docker load --input /tmp/mdr-image.tar
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Tag and push release image
        env:
          VERSION: ${{ needs.release-version.outputs.version }}
        run: |
          VERSION_NUMBER="${VERSION#v}"
          docker tag mdr:ci "${IMAGE_NAME}:${VERSION}"
          docker tag mdr:ci "${IMAGE_NAME}:${VERSION_NUMBER}"
          docker tag mdr:ci "${IMAGE_NAME}:sha-${GITHUB_SHA}"
          docker push "${IMAGE_NAME}:${VERSION}"
          docker push "${IMAGE_NAME}:${VERSION_NUMBER}"
          docker push "${IMAGE_NAME}:sha-${GITHUB_SHA}"

  prepare-binaries:
    name: Prepare binaries for release
    needs: [build-binaries, release-version]
    if: always() && needs.build-binaries.result == 'success' && needs.release-version.result == 'success' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    steps:
      - name: Download binary artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: binary-*
          path: release-assets
          merge-multiple: true
      - name: Store release binaries
        uses: actions/upload-artifact@v4
        with:
          name: mdr-release-assets
          path: release-assets/*

  create-release-tag:
    name: Create release tag
    needs: [checks, release-version, container-tests]
    if: always() && needs.checks.result == 'success' && needs.release-version.result == 'success' && needs.container-tests.result == 'success' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    steps:
      - name: Check out full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Create or verify release tag
        env:
          VERSION: ${{ needs.release-version.outputs.version }}
        run: |
          if git rev-parse "$VERSION" >/dev/null 2>&1; then
            echo "Release tag $VERSION already exists"
          else
            git tag "$VERSION" "$GITHUB_SHA"
            git push origin "$VERSION"
            echo "Created release tag $VERSION"
          fi

  release:
    name: Create GitHub release
    needs: [create-release-tag, prepare-binaries, release-version]
    if: always() && needs.create-release-tag.result == 'success' && needs.prepare-binaries.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Check out release tag
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Download release binaries
        uses: actions/download-artifact@v4
        with:
          name: mdr-release-assets
          path: release-assets
      - name: Create release and upload binaries
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.release-version.outputs.version }}
        run: |
          cat > release-notes.md <<EOF
          # MDR ${VERSION}

          ## Docker image

          docker pull ${IMAGE_NAME}:${VERSION}

          ## Binaries

          - Linux: mdr-${VERSION}-linux
          - macOS: mdr-${VERSION}-macos
          - Windows: mdr-${VERSION}-windows.exe
          EOF
          if gh release view "${VERSION}" >/dev/null 2>&1; then
            gh release upload "${VERSION}" release-assets/* --clobber
            gh release edit "${VERSION}" --notes-file release-notes.md
          else
            gh release create "${VERSION}" release-assets/* --notes-file release-notes.md
          fi
